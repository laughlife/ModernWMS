# ModernWMS production site
# Frontend files: /opt/modernwms/frontend
# Backend service: http://127.0.0.1:21011
# TLS certificates: Certbot standard paths

server {
    listen 80;
    listen [::]:80;
    server_name wms.nyamtn.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wms.nyamtn.com;

    ssl_certificate /etc/letsencrypt/live/wms.nyamtn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wms.nyamtn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ModernWMS_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/modernwms/frontend;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/wms.nyamtn.com.access.log;
    error_log /var/log/nginx/wms.nyamtn.com.error.log warn;

    client_max_body_size 100m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:21011/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Unity WebGL 产物已经由 Unity 预先使用 gzip 压缩，必须返回正确的编码和 MIME。
    location ~* \.data\.unityweb$ {
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location ~* \.wasm\.unityweb$ {
        try_files $uri =404;
        default_type application/wasm;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location ~* \.js\.unityweb$ {
        try_files $uri =404;
        default_type application/javascript;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|webp|svg|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}
